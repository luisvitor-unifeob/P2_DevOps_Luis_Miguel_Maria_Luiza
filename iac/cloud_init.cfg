
#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

#Definir o user
users:
  - default
  - name: aluno
    gecos: DevOps Lab
    #Grupos que o usuário vai participar
    groups:
      - adm
      - sudo
      - docker
    shell: /bin/bash
    #Regras para usuario usar o sudo
    sudo:
      - "ALL=(ALL) NOPASSWD: ALL"
    ssh_authorized_keys:
      - ${ssh_key}

ssh_pwauth: false
disable_root: true

package_update: true

packages:
  - curl
  - git
  - docker.io
  - docker-compose-v2

runcmd:
  - systemctl enable --now docker
