
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
</head>
<body>
    <h1>Cadastro de Livros</h1>

    <form id="formLivro">
        <label for="titulo">Título do livro:</label>
        <input type="text" id="titulo" required>
        <br><br>

        <label for="autor">Autor:</label>
        <input type="text" id="autor" required>
        <br><br>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" min="0" required>
        <br><br>

        <label for="quantidade">Quantidade em estoque:</label>
        <input type="number" id="quantidade" min="0" step="1" required>
        <br><br>

        <button type="submit">Cadastrar livro</button>
    </form>

    <p id="mensagem"></p>

    <a href="#" id="listarLivros">Listar todos os livros</a>

    <h2>Livros cadastrados</h2>
    <ul id="listaLivros"></ul>

    <script>
        const API_URL = "http://192.168.122.7:3000";

        document.getElementById("formLivro").addEventListener("submit", async function(event) {
            event.preventDefault();

            const livro = {
                titulo: document.getElementById("titulo").value,
                autor: document.getElementById("autor").value,
                preco: Number(document.getElementById("preco").value),
                quantidade: Number(document.getElementById("quantidade").value)
            };

            try {
                const resposta = await fetch(`${API_URL}/livro`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(livro)
                });

                if (!resposta.ok) {
                    throw new Error("Erro ao cadastrar livro");
                }

                document.getElementById("mensagem").textContent =
                    "Livro cadastrado com sucesso!";

                document.getElementById("formLivro").reset();
            } catch (erro) {
                document.getElementById("mensagem").textContent =
                    "Erro ao cadastrar livro: " + erro.message;
            }
        });

        document.getElementById("listarLivros").addEventListener("click", async function(event) {
            event.preventDefault();

            try {
                const resposta = await fetch(`${API_URL}/livros`);

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar livros");
                }

                const livros = await resposta.json();
                const lista = document.getElementById("listaLivros");

                lista.innerHTML = "";

                livros.forEach(function(livro) {
                    const item = document.createElement("li");

                    item.textContent =
                        `${livro.titulo} - ${livro.autor} - R$ ${livro.preco} - Estoque: ${livro.quantidade}`;

                    lista.appendChild(item);
                });
            } catch (erro) {
                document.getElementById("mensagem").textContent =
                    "Erro ao listar livros: " + erro.message;
            }
        });
    </script>
</body>
</html>
